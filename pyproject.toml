[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrupt"
version = "0.1.0"
description = "Dataset + benchmark for restoring intentionally corrupted text."
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.60",
]

[tool.setuptools.packages.find]
include = ["terrupt*"]